apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.fullnameOverride }}
  labels:
    {{- include "user-service.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: { app.kubernetes.io/name: user-service }
  template:
    metadata:
      labels: { app.kubernetes.io/name: user-service }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "5001" }
    spec:
      containers:
        - name: user-service
          image: "{{- if .Values.image.registry }}{{ .Values.image.registry }}/{{ end }}{{ .Values.image.repository }}:{{ required "image.tag must be set to an immutable commit tag" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ name: http, containerPort: 5001 }]
          env:
            - name: PORT
              value: "5001"
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: ecommerce-secrets, key: jwt_secret } }
            - name: MONGO_URI
              value: "mongodb://mongodb-service:27017/{{ .Values.mongoDatabase }}"
          livenessProbe: { httpGet: { path: /health, port: http }, initialDelaySeconds: 15 }
          readinessProbe: { httpGet: { path: /health, port: http }, initialDelaySeconds: 5 }
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
