apiVersion: v1
kind: ConfigMap
metadata: { name: grafana-datasources }
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        url: http://prometheus:9090
        access: proxy
        isDefault: true
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: grafana }
spec:
  replicas: 1
  selector: { matchLabels: { app: grafana } }
  template:
    metadata: { labels: { app: grafana } }
    spec:
      containers:
        - name: grafana
          image: {{ .Values.grafana.image }}
          ports: [{ name: http, containerPort: 3000 }]
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom: { secretKeyRef: { name: ecommerce-secrets, key: grafana_admin_user } }
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: ecommerce-secrets, key: grafana_admin_password } }
          volumeMounts: [{ name: config, mountPath: /etc/grafana/provisioning/datasources }]
      volumes: [{ name: config, configMap: { name: grafana-datasources } }]
---
apiVersion: v1
kind: Service
metadata: { name: grafana }
spec:
  selector: { app: grafana }
  ports: [{ name: http, port: 80, targetPort: http }]
