apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongodb-pvc
  labels:
    {{- include "infrastructure.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: { storage: {{ .Values.mongodb.storage }} }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  labels:
    {{- include "infrastructure.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: mongodb } }
  template:
    metadata: { labels: { app.kubernetes.io/name: mongodb } }
    spec:
      containers:
        - name: mongodb
          image: {{ .Values.mongodb.image }}
          ports: [{ name: mongodb, containerPort: 27017 }]
          readinessProbe: { tcpSocket: { port: mongodb }, initialDelaySeconds: 10 }
          volumeMounts: [{ name: data, mountPath: /data/db }]
      volumes: [{ name: data, persistentVolumeClaim: { claimName: mongodb-pvc } }]
---
apiVersion: v1
kind: Service
metadata: { name: mongodb-service }
spec:
  selector: { app.kubernetes.io/name: mongodb }
  ports: [{ name: mongodb, port: 27017, targetPort: mongodb }]
