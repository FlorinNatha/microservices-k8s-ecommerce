apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    {{- include "infrastructure.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: redis } }
  template:
    metadata: { labels: { app.kubernetes.io/name: redis } }
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          ports: [{ name: redis, containerPort: 6379 }]
          readinessProbe: { tcpSocket: { port: redis } }
---
apiVersion: v1
kind: Service
metadata: { name: redis-service }
spec:
  selector: { app.kubernetes.io/name: redis }
  ports: [{ name: redis, port: 6379, targetPort: redis }]
