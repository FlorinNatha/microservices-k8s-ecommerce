apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  labels:
    {{- include "payment-service.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: { app.kubernetes.io/name: payment-service }
  template:
    metadata:
      labels: { app.kubernetes.io/name: payment-service }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "5004" }
    spec:
      containers:
        - name: payment-service
          image: "{{- if .Values.image.registry }}{{ .Values.image.registry }}/{{ end }}{{ .Values.image.repository }}:{{ required "image.tag must be set to an immutable commit tag" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ name: http, containerPort: 5004 }]
          env:
            - name: PORT
              value: "5004"
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: ecommerce-secrets, key: jwt_secret } }
            - name: MONGO_URI
              value: "mongodb://mongodb-service:27017/{{ .Values.mongoDatabase }}"
            - name: RABBITMQ_URL
              value: amqp://rabbitmq-service:5672
            - name: STRIPE_SECRET_KEY
              valueFrom: { secretKeyRef: { name: ecommerce-secrets, key: stripe_secret_key } }
          livenessProbe: { httpGet: { path: /health, port: http }, initialDelaySeconds: 15 }
          readinessProbe: { httpGet: { path: /health, port: http }, initialDelaySeconds: 5 }
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
