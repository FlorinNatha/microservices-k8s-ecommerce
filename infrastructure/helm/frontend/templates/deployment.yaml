apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    {{- include "frontend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: { app.kubernetes.io/name: frontend }
  template:
    metadata:
      labels: { app.kubernetes.io/name: frontend }
    spec:
      containers:
        - name: frontend
          image: "{{- if .Values.image.registry }}{{ .Values.image.registry }}/{{ end }}{{ .Values.image.repository }}:{{ required "image.tag must be set to an immutable commit tag" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ name: http, containerPort: 80 }]
          livenessProbe: { httpGet: { path: /, port: http }, initialDelaySeconds: 10 }
          readinessProbe: { httpGet: { path: /, port: http }, initialDelaySeconds: 5 }
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
