apiVersion: v1
kind: Secret
metadata:
  name: ecommerce-secrets
  labels:
    {{- include "platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  jwt_secret: {{ required "secrets.jwtSecret must be provided at deploy time" .Values.secrets.jwtSecret | quote }}
  stripe_secret_key: {{ required "secrets.stripeSecretKey must be provided at deploy time" .Values.secrets.stripeSecretKey | quote }}
  grafana_admin_user: {{ required "secrets.grafanaAdminUser must be provided at deploy time" .Values.secrets.grafanaAdminUser | quote }}
  grafana_admin_password: {{ required "secrets.grafanaAdminPassword must be provided at deploy time" .Values.secrets.grafanaAdminPassword | quote }}
