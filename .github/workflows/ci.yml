# =============================================================================
# GitHub Actions CI Pipeline with Security Scanning & Docker Registry Push
# Project: Microservices E-Commerce Platform
# =============================================================================

name: Microservices E-Commerce CI Pipeline

on:
  push:
    branches:
      - main
      - master
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - master

jobs:
  # =====================================================================
  # JOB 1: Validate Kubernetes Manifests
  # =====================================================================
  validate-k8s-manifests:
    name: 🔍 Validate Kubernetes Manifests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PyYAML
        run: python -m pip install pyyaml

      - name: Validate Kubernetes Manifests Syntax
        run: |
          echo "Validating Kubernetes YAML syntax..."
          MANIFESTS=$(find infrastructure/kubernetes services/*/k8s api-gateway/k8s frontend/k8s -type f \( -name "*.yaml" -o -name "*.yml" \) 2>/dev/null | grep -v "node_modules")

          for file in $MANIFESTS; do
            echo "Checking $file..."
            python -c "import yaml; list(yaml.safe_load_all(open('$file')))"
          done
          echo "✅ All Kubernetes manifests passed syntax validation!"

  # =====================================================================
  # JOB 2: Verify All Node.js Services
  # =====================================================================
  build-and-verify-services:
    name: 📦 Verify Node.js Services
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - services/auth-service
          - services/user-service
          - services/product-service
          - services/order-service
          - services/payment-service
          - api-gateway
          - frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          cd ${{ matrix.service }}
          npm install

      - name: Verify Node.js Syntax
        run: |
          cd ${{ matrix.service }}
          node --check src/server.js || node --check src/main.jsx || true

  # =====================================================================
  # JOB 3: Build, Security Scan (Trivy), and Push Docker Images
  # =====================================================================
  build-scan-and-push-docker:
    name: 🛡️ Build, Scan & Push Docker Images
    needs: [validate-k8s-manifests, build-and-verify-services]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: auth-service
            context: services/auth-service
            image: auth-service
          - service: user-service
            context: services/user-service
            image: user-service
          - service: product-service
            context: services/product-service
            image: product-service
          - service: order-service
            context: services/order-service
            image: order-service
          - service: payment-service
            context: services/payment-service
            image: payment-service
          - service: api-gateway
            context: api-gateway
            image: api-gateway
          - service: frontend
            context: frontend
            image: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 1: Log in to Docker Hub (if secrets are configured)
      - name: Log in to Docker Hub
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        if: env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 2: Build Docker Image locally on runner for scanning
      - name: Build Local Docker Image for Trivy Scanning
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.context }}
          file: ./${{ matrix.context }}/Dockerfile
          load: true
          tags: ${{ matrix.image }}:${{ github.sha }}

      # Step 3: Trivy Security Scan (Scans Docker Image for Vulnerabilities)
      - name: 🛡️ Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ matrix.image }}:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      # Step 4: Push Tagged Image to Docker Hub Registry
      - name: Push Docker Image to Registry
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        if: env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != ''
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.context }}
          file: ./${{ matrix.context }}/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
