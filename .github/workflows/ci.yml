# =============================================================================
# GitHub Actions CI Pipeline with Security Scanning & Docker Registry Push
# Project: Microservices E-Commerce Platform
# =============================================================================

name: Microservices E-Commerce CI Pipeline

on:
  push:
    branches:
      - main
      - master
      - 'feature/**'
      - 'fix/**'
      - 'ci/**'

  pull_request:
    branches:
      - main
      - master

jobs:
  # =====================================================================
  # JOB 1: Validate Kubernetes Manifests
  # =====================================================================
  validate-k8s-manifests:
    name: 🔍 Validate Kubernetes Manifests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PyYAML
        run: python -m pip install pyyaml

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint and render Helm charts
        run: |
          set -euo pipefail
          : > rendered-manifests.yaml

          for chart in infrastructure/helm/*; do
            if [[ -f "${chart}/Chart.yaml" ]]; then
              chart_name="$(basename "${chart}")"
              echo "Linting ${chart_name}..."
              helm lint "${chart}" --set-string image.tag=ci-validation --set-string secrets.jwtSecret=ci-validation --set-string secrets.stripeSecretKey=ci-validation --set-string secrets.grafanaAdminUser=ci-validation --set-string secrets.grafanaAdminPassword=ci-validation
              echo "Rendering ${chart_name}..."
              helm template "${chart_name}" "${chart}" --namespace ecommerce --set-string image.tag=ci-validation --set-string secrets.jwtSecret=ci-validation --set-string secrets.stripeSecretKey=ci-validation --set-string secrets.grafanaAdminUser=ci-validation --set-string secrets.grafanaAdminPassword=ci-validation >> rendered-manifests.yaml
            fi
          done

      - name: Validate Rendered Helm Manifests
        run: |
          echo "Validating Kubernetes YAML syntax..."
          python -c "import yaml; list(yaml.safe_load_all(open('rendered-manifests.yaml')) )"
          echo "✅ All Kubernetes manifests passed syntax validation!"

  # =====================================================================
  # JOB 2: Verify All Node.js Services
  # =====================================================================
  build-and-verify-services:
    name: 📦 Verify Node.js Services
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - services/auth-service
          - services/user-service
          - services/product-service
          - services/order-service
          - services/payment-service
          - services/api-gateway
          - frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          cd ${{ matrix.service }}
          npm install

      - name: Lint Frontend
        if: matrix.service == 'frontend'
        run: npm run lint --prefix frontend

      - name: Build Frontend
        if: matrix.service == 'frontend'
        run: npm run build --prefix frontend

      - name: Verify Node.js Syntax
        run: |
          cd ${{ matrix.service }}
          node --check src/server.js || node --check src/main.jsx || true

  # =====================================================================
  # JOB 3: Build, Security Scan (Trivy), and Push Docker Images
  # =====================================================================
  build-scan-and-push-docker:
    name: 🛡️ Build, Scan & Push Docker Images
    needs: [validate-k8s-manifests, build-and-verify-services]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: auth-service
            context: services/auth-service
            image: auth-service
          - service: user-service
            context: services/user-service
            image: user-service
          - service: product-service
            context: services/product-service
            image: product-service
          - service: order-service
            context: services/order-service
            image: order-service
          - service: payment-service
            context: services/payment-service
            image: payment-service
          - service: api-gateway
            context: services/api-gateway
            image: api-gateway
          - service: frontend
            context: frontend
            image: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 1: Log in to Docker Hub (if secrets are configured)
      - name: Log in to Docker Hub
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        if: env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 2: Build Docker Image locally on runner for scanning
      - name: Build Local Docker Image for Trivy Scanning
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.context }}
          file: ./${{ matrix.context }}/Dockerfile
          load: true
          tags: ${{ matrix.image }}:${{ github.sha }}

      # Step 3: Trivy Security Scan (Scans Docker Image for Vulnerabilities)
      - name: 🛡️ Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ matrix.image }}:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      # Step 4: Push Tagged Image to Docker Hub Registry
      - name: Push Docker Image to Registry
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          IMAGE_REGISTRY: docker.io/${{ secrets.DOCKER_USERNAME }}
        if: env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != ''
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.context }}
          file: ./${{ matrix.context }}/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_REGISTRY }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
